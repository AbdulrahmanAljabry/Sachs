<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دورات ساكس السعرية - أكاديمية أبطال التداول</title>
<style>
body {
  font-family: "Arial", sans-serif;
  background: linear-gradient(120deg, #1a1a1a, #111);
  color: #f5f5f5;
  text-align: center;
  margin: 0;
  padding: 20px;
  direction: rtl;
}

header {
  margin-bottom: 20px;
}

header img {
  width: 120px;
  height: auto;
  border-radius: 10px;
  box-shadow: 0 0 15px gold;
  transition: transform 0.3s;
}

header img:hover {
  transform: rotate(10deg) scale(1.05);
}

h1 {
  color: gold;
  margin: 10px 0 20px 0;
  text-shadow: 0 0 10px #ffdf00;
}

button {
  font-size: 18px;
  padding: 12px 20px;
  margin: 10px;
  border-radius: 8px;
  background-color: gold;
  border: none;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 0 10px #ffdf00;
}

button:hover {
  background-color: #ffdf00;
  transform: scale(1.05);
}

button:active {
  transform: scale(0.95);
  background-color: #e6c200;
}

.result {
  background-color: #222;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  font-size: 18px;
  line-height: 1.8;
  text-align: right;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px #000;
  transition: transform 0.3s, box-shadow 0.3s;
  max-height: 500px;
  overflow-y: auto;
}

.result.show {
  animation: bubble 0.5s ease-out;
}

@keyframes bubble {
  0% { transform: scale(0.5) translateY(30px); opacity: 0; }
  70% { transform: scale(1.05) translateY(-5px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

footer {
  margin-top: 30px;
  font-size: 14px;
  color: #ccc;
}

footer a {
  color: #ffdf00;
  text-decoration: none;
  font-weight: bold;
}

footer a:hover {
  text-decoration: underline;
}

.value {
  font-weight: bold;
  display: inline-block;
  width: 100%;
  padding: 3px 0;
  border-radius: 5px;
  transition: background 0.3s;
  cursor: pointer;
}

.base { color: gold; font-weight: bold; background: rgba(255,215,0,0.2); }
.green { color: #00FF00; background: rgba(0,255,0,0.1); }
.red { color: #B22222; background: rgba(178,34,34,0.1); }
.blue { color: #00BFFF; background: rgba(0,191,255,0.1); }
.black { color: #fff; background: rgba(0,0,0,0.2); }
</style>
</head>
<body>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<header>
  <a href="https://linktr.ee/heroesfx" target="_blank">
    <img src="https://d1yei2z3i6k35z.cloudfront.net/11591109/688e15b7e71bc_TradingHeroes2025logo1.png" alt="شعار أكاديمية أبطال التداول">
  </a>
</header>

<h1>دورات ساكس السعرية</h1>

<p>اضغط على الزر لحساب 200 دورة سعرية متتالية:</p>
<button onclick="playClick(); calculate()">احسب الدورات</button>
<button onclick="playClick(); saveResults()">حفظ النتائج كملف TXT</button>

<div id="output"></div>

<footer>
© 2025 أكاديمية أبطال التداول – جميع الحقوق محفوظة<br>
by <a href="https://t.me/AbdulrahmanAljabry" target="_blank">Abdulrahman Aljabry</a> – Trading Heroes Academy
</footer>

<script>
let lastResults = "";

function playClick() {
  const audio = document.getElementById("clickSound");
  audio.currentTime = 0;
  audio.play();
}

function calculate() {
  const base = 1800;
  const cycles = [base];
  let current = base;

  for (let i = 1; i < 200; i++) {
    current = Math.round(Math.pow(Math.sqrt(current) + 2, 2));
    cycles.push(current);
  }

  const colors = ["green","red","blue","black","green","red"];
  let resultHTML = `<div class='result show'><strong>الدورات الرئيسية:</strong><br>`;
  cycles.forEach((val, i) => {
    resultHTML += `<span class='value ${colors[i % colors.length]}' onclick="showSubCycles(${val})">${val}</span><br>`;
  });
  resultHTML += "</div>";

  document.getElementById('output').innerHTML = resultHTML;
  lastResults = cycles.join("\n");
}

// عند الضغط على أي دورة، إظهار الدورات الفرعية ±0.25, ±0.5 ... ±2
function showSubCycles(n) {
  const deltas = [0.25,0.5,0.75,1,1.25,1.5,1.75,2];
  const colors = ["green","red","blue","black","green","red","blue","black"];
  let html = `<div class='result show'><strong>الدورات حول ${n}:</strong><br>`;

  // الموجب
  deltas.forEach((d,i) => {
    let val = Math.round(Math.pow(Math.sqrt(n)+d, 2));
    html += `<span class='value ${colors[i % colors.length]}' onclick="copyValue('${val}')">${val}</span> &nbsp; (+${d})<br>`;
  });

  // السالب
  deltas.forEach((d,i) => {
    let val = Math.round(Math.pow(Math.sqrt(n)-d, 2));
    html += `<span class='value ${colors[i % colors.length]}' onclick="copyValue('${val}')">${val}</span> &nbsp; (-${d})<br>`;
  });

  html += "</div>";

  // عرض أسفل الدورات الرئيسية
  const outputDiv = document.getElementById('output');
  outputDiv.insertAdjacentHTML('beforeend', html);
}

function copyValue(val) {
  navigator.clipboard.writeText(val).then(() => {
    playClick();
  });
}

function saveResults() {
  if (!lastResults) {
    alert("لا توجد نتائج للحفظ — اضغط احسب الدورات أولاً");
    return;
  }
  const blob = new Blob([lastResults], {type: "text/plain;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "sachs_cycles_200.txt";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

</body>
</html>
